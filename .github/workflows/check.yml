name: Check papers

# Runs on every push and pull request. Open the "Actions" tab on GitHub to see the result.
on: [push, pull_request, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: JSON files are valid
        run: |
          for f in papers/index.json papers/*/*.json proceedings/*.json proceedings/*/paper.json proceedings/front/*.json; do
            python -m json.tool "$f" > /dev/null || { echo "Invalid JSON in $f"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: JavaScript has no syntax errors
        run: for f in assets/*.js; do node --check "$f"; done
      - name: Example paper text still matches its PDF
        run: for d in papers/*/; do echo "== $d"; python pipeline/check_fidelity.py "$d"; done
      - name: Download the proceedings PDF (release LTS)
        run: curl -sSLf -o /tmp/proceedings.pdf https://github.com/SytzeAndr/spaice-interactive-proceedings/releases/download/LTS/Conference_Proceedings_SPAICE_2026.pdf
      - name: Proceedings text still matches the PDF
        run: python pipeline/check_proceedings.py /tmp/proceedings.pdf
